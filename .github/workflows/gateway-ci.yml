name: Gateway CI

on:
  push:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci.yml"

jobs:
  chaos-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip fastapi httpx
      - run: python -m unittest -v test_gateway.py
      - name: Save test report
        if: always()
        run: python -m unittest -v test_gateway.py | tee gateway-test-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-test-results
          path: gateway/gateway-test-results.txt
